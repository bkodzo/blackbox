version: 2
project_name: blackbox

builds:
  - main: ./cmd/blackbox
    binary: blackbox
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - examples/risk.json

checksum:
  name_template: checksums.txt

# One SBOM per archive, generated with syft.
sboms:
  - artifacts: archive

# Keyless signature over the checksums, which cover every archive.
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--bundle=${signature}", "${artifact}", "--yes"]

changelog:
  use: github
  filters:
    exclude:
      - "^Merge"
