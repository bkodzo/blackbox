name: demo

# Publishes the dashboard for a scripted sample log, and for a copy of it
# with one edited entry, to GitHub Pages.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: build the sample and its tampered copy
        run: go run ./examples/demolog -out demo
      - name: export both dashboards
        run: |
          go build -o "$RUNNER_TEMP/blackbox" ./cmd/blackbox
          cd demo
          "$RUNNER_TEMP/blackbox" dashboard --log sample.jsonl --checkpoints sample.checkpoints.jsonl --pub key.pub \
            --export ../site --export-note "The traffic is scripted; no model was used. The tampered folder holds a copy with one edited entry."
          cd tampered
          "$RUNNER_TEMP/blackbox" dashboard --log sample.jsonl --checkpoints sample.checkpoints.jsonl --pub key.pub \
            --export ../../site/tampered --export-note "This copy of the sample has one edited entry, which the integrity check finds."
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
